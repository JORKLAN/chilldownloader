<svg width="720" height="120" viewBox="0 0 720 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Feature icons">
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#34c759"/>
    </linearGradient>
    <style>
      .card { fill:#15171a; stroke:#23262a; stroke-width:1; }
      .ic   { fill:none; stroke:#e8e9eb; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .lbl  { fill:#cfd1d6; font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif; font-size:13px; font-weight:600; text-anchor:middle; }
    </style>
  </defs>

  <!-- Ad hiding -->
  <g transform="translate(10,10)">
    <rect class="card" width="160" height="100" rx="14"/>
    <g transform="translate(80,38)">
      <rect class="ic" x="-22" y="-14" width="44" height="28" rx="4"/>
      <line class="ic" x1="-26" y1="18" x2="26" y2="-20" stroke="url(#ac)" stroke-width="3"/>
    </g>
    <text class="lbl" x="80" y="82">Ad hiding</text>
  </g>

  <!-- Auto-skip -->
  <g transform="translate(190,10)">
    <rect class="card" width="160" height="100" rx="14"/>
    <g transform="translate(80,38)">
      <path class="ic" d="M-18 -12 L4 0 L-18 12 Z" fill="url(#ac)" stroke="none"/>
      <line class="ic" x1="10" y1="-13" x2="10" y2="13"/>
    </g>
    <text class="lbl" x="80" y="82">Ad auto-skip</text>
  </g>

  <!-- Controls -->
  <g transform="translate(370,10)">
    <rect class="card" width="160" height="100" rx="14"/>
    <g transform="translate(80,38)">
      <line class="ic" x1="-24" y1="-8" x2="24" y2="-8"/>
      <circle cx="8" cy="-8" r="5" fill="url(#ac)" stroke="none"/>
      <line class="ic" x1="-24" y1="10" x2="24" y2="10"/>
      <circle cx="-6" cy="10" r="5" fill="url(#ac)" stroke="none"/>
    </g>
    <text class="lbl" x="80" y="82">Brightness / Volume</text>
  </g>

  <!-- i18n -->
  <g transform="translate(550,10)">
    <rect class="card" width="160" height="100" rx="14"/>
    <g transform="translate(80,38)">
      <circle class="ic" cx="0" cy="0" r="16"/>
      <path class="ic" d="M-16 0 H16 M0 -16 V16 M-11 -9 Q0 4 11 -9 M-11 9 Q0 -4 11 9" stroke="url(#ac)"/>
    </g>
    <text class="lbl" x="80" y="82">11 languages</text>
  </g>
</svg>
