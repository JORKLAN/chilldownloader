<svg width="720" height="120" viewBox="0 0 720 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Feature icons">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d21"/>
      <stop offset="1" stop-color="#111316"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <style>
      .card { fill:url(#cardBg); stroke:#26292e; stroke-width:1; }
      .ic   { fill:none; stroke:#e8e9eb; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
      .icFill { fill:#e8e9eb; }
      .lbl  { fill:#d4d6db; font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif; font-size:12px; font-weight:600; text-anchor:middle; letter-spacing:0.2px; }
    </style>
  </defs>

  <!-- Card 1: Ad hiding (AD inside prohibition circle) -->
  <g transform="translate(10,10)">
    <rect class="card" width="160" height="100" rx="14"/>
    <circle cx="80" cy="40" r="28" fill="url(#glow)"/>
    <g transform="translate(80,40)">
      <!-- prohibition circle -->
      <circle cx="0" cy="0" r="18" fill="none" stroke="url(#redGrad)" stroke-width="2.4"/>
      <!-- AD text inside -->
      <text x="0" y="4.2" text-anchor="middle"
            font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif"
            font-size="13" font-weight="800" fill="#e8e9eb" letter-spacing="0.5">AD</text>
      <!-- diagonal slash -->
      <line x1="-12.7" y1="-12.7" x2="12.7" y2="12.7"
            stroke="url(#redGrad)" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <text class="lbl" x="80" y="86">Ad hiding</text>
  </g>

  <!-- Card 2: Ad auto-skip (Skip Ad button) -->
  <g transform="translate(190,10)">
    <rect class="card" width="160" height="100" rx="14"/>
    <circle cx="80" cy="40" r="28" fill="url(#glow)"/>
    <g transform="translate(80,40)">
      <!-- pill button -->
      <rect x="-26" y="-11" width="52" height="22" rx="11"
            fill="#1f2226" stroke="#3a3d42" stroke-width="1.2"/>
      <text x="-8" y="4" text-anchor="middle"
            font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif"
            font-size="10" font-weight="700" fill="#e8e9eb" letter-spacing="0.3">Skip</text>
      <!-- skip-to-end icon: triangle + bar -->
      <path d="M8 -5 L15 0 L8 5 Z" fill="url(#accent)"/>
      <line x1="17" y1="-5" x2="17" y2="5" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text class="lbl" x="80" y="86">Ad auto-skip</text>
  </g>

  <!-- Card 3: Brightness / Volume (sun + speaker) -->
  <g transform="translate(370,10)">
    <rect class="card" width="160" height="100" rx="14"/>
    <circle cx="80" cy="40" r="28" fill="url(#glow)"/>
    <g transform="translate(80,40)">
      <!-- Sun (brightness) -->
      <g transform="translate(-18,0)">
        <circle cx="0" cy="0" r="5.5" fill="none" stroke="url(#accent)" stroke-width="2"/>
        <g stroke="#e8e9eb" stroke-width="2" stroke-linecap="round">
          <line x1="0" y1="-10" x2="0" y2="-13"/>
          <line x1="0" y1="10" x2="0" y2="13"/>
          <line x1="-10" y1="0" x2="-13" y2="0"/>
          <line x1="10" y1="0" x2="13" y2="0"/>
          <line x1="-7.5" y1="-7.5" x2="-9.5" y2="-9.5"/>
          <line x1="7.5" y1="-7.5" x2="9.5" y2="-9.5"/>
          <line x1="-7.5" y1="7.5" x2="-9.5" y2="9.5"/>
          <line x1="7.5" y1="7.5" x2="9.5" y2="9.5"/>
        </g>
      </g>
      <!-- divider -->
      <line x1="0" y1="-11" x2="0" y2="11" stroke="#2d3036" stroke-width="1"/>
      <!-- Speaker (volume) -->
      <g transform="translate(14,0)">
        <path d="M-7 -3 L-3 -3 L2 -8 L2 8 L-3 3 L-7 3 Z"
              fill="#e8e9eb" stroke="#e8e9eb" stroke-width="1" stroke-linejoin="round"/>
        <path d="M5 -4 Q8 0 5 4" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
        <path d="M8 -7 Q12 0 8 7" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
    <text class="lbl" x="80" y="86">Brightness / Volume</text>
  </g>

  <!-- Card 4: 11 languages (A / 文 translation icon) -->
  <g transform="translate(550,10)">
    <rect class="card" width="160" height="100" rx="14"/>
    <circle cx="80" cy="40" r="28" fill="url(#glow)"/>
    <g transform="translate(80,40)">
      <!-- Latin A -->
      <text x="-10" y="2" text-anchor="middle"
            font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif"
            font-size="22" font-weight="800" fill="#e8e9eb">A</text>
      <!-- arrow between -->
      <path d="M-2 4 L4 4" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M2 1.5 L5 4 L2 6.5" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- CJK glyph 文 -->
      <text x="12" y="6" text-anchor="middle"
            font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif"
            font-size="18" font-weight="700" fill="url(#accent)">文</text>
    </g>
    <text class="lbl" x="80" y="86">11 languages</text>
  </g>
</svg>
